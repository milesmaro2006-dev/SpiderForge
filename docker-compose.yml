version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: spiderforge
      POSTGRES_PASSWORD: spiderforge123
      POSTGRES_DB: spiderforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
      - redis
    environment:
      DATABASE_URL: postgresql://spiderforge:spiderforge123@postgres:5432/spiderforge
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0

  celery-worker:
    build: ./backend
    command: celery -A core.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
      - mongodb
    environment:
      DATABASE_URL: postgresql://spiderforge:spiderforge123@postgres:5432/spiderforge
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
  mongo_data:
